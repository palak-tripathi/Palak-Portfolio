<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
      <filter id="coffee-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
      <!-- Thick White Border -->
      <rect x="25" y="30" width="70" height="75" rx="14" fill="#ffffff" filter="url(#coffee-shadow)"/>
      <!-- Brass Davarah (Bottom Bowl) -->
      <path d="M 28 75 L 32 95 Q 60 105 88 95 L 92 75 Z" fill="#d97706"/>
      <path d="M 32 75 L 35 92 Q 60 100 85 92 L 88 75 Z" fill="#f59e0b"/>
      <!-- Brass Tumbler (Top Cup) -->
      <path d="M 40 38 L 44 80 Q 60 84 76 80 L 80 38 Z" fill="#d97706"/>
      <path d="M 43 40 L 46 76 Q 60 80 74 76 L 77 40 Z" fill="#fbbf24"/>
      <!-- Frothy Coffee Foam -->
      <ellipse cx="60" cy="40" rx="17" ry="6" fill="#78350f"/>
      <ellipse cx="60" cy="39" rx="15" ry="4" fill="#fef3c7" opacity="0.9"/>
      <!-- Rising Steam Curlicues -->
      <path d="M 52 28 Q 50 20 54 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 52 28 Q 50 20 54 14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M 68 26 Q 72 18 67 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 68 26 Q 72 18 67 12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>